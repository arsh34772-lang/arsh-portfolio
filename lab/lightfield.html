<style>
  html,body{margin:0;height:100%;background:#030503;overflow:hidden}
  .lf{position:fixed;inset:0;width:100%;height:100%;display:block}
  .lf-mob{display:none}
  .drift{will-change:transform}
  .da{animation:driftA 20s ease-in-out infinite}
  .db{animation:driftB 20s ease-in-out infinite}
  .dc{animation:driftC 20s ease-in-out infinite}
  .field{animation:breathe 9s ease-in-out infinite}
  @keyframes driftA{0%{transform:translate3d(-9px,5px,0)}50%{transform:translate3d(9px,-6px,0)}100%{transform:translate3d(-9px,5px,0)}}
  @keyframes driftB{0%{transform:translate3d(7px,-4px,0)}50%{transform:translate3d(-8px,5px,0)}100%{transform:translate3d(7px,-4px,0)}}
  @keyframes driftC{0%{transform:translate3d(-5px,3px,0)}50%{transform:translate3d(5px,-3px,0)}100%{transform:translate3d(-5px,3px,0)}}
  @keyframes breathe{0%,100%{opacity:.94}45%{opacity:1}}
  .tag{position:fixed;left:20px;bottom:18px;font:500 10px/1 ui-sans-serif,system-ui,sans-serif;
    letter-spacing:.26em;text-transform:uppercase;color:rgba(207,255,82,.5)}
  .tag b{color:#CFFF52;font-weight:600}
  @media(max-width:700px){
    .lf-desk{display:none} .lf-mob{display:block}
    .tag{left:14px;bottom:14px;font-size:9px}
  }
  @media (prefers-reduced-motion:reduce){.da,.db,.dc,.field{animation:none}}
</style>
